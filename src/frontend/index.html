<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CourseFix — Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background:#0b1220; color:#e6edf3; }
    .wrap { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 28px; margin: 0 0 16px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background:#0f1629; border:1px solid #1f2a44; border-radius: 12px; padding:16px; }
    .form-control { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
    .form-actions { display:flex; gap:8px; margin-top:8px; }
    .btn { padding:10px 14px; border-radius:10px; background:#2563eb; border:0; color:white; cursor:pointer; }
    .btn.secondary { background:#334155; }
    select, input[type="file"] { padding:10px; background:#0b1220; color:#e6edf3; border:1px solid #1f2a44; border-radius:8px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { background:#111a33; border:1px solid #223058; color:#b3c1e2; padding:6px 10px; border-radius:999px; font-size:13px; }
    ul { list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:8px; }
    .pill { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; background:#1f2937; }
    .pill.ok { background:#064e3b; }
    .pill.warn { background:#7c2d12; }
    .pill.err { background:#7f1d1d; }
    .small { opacity:.8; font-size:12px; }
    .muted { opacity:.75; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    pre { background:#0b1220; border:1px solid #1f2a44; padding:12px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CourseFix — Planner</h1>

    <div class="grid">
      <div class="card">
        <form id="uploadForm" enctype="multipart/form-data">
          <div class="form-control">
            <label class="label">Campus Filter</label>
            <select id="campusSelect" multiple>
              <option value="nyc" selected>New York</option>
              <option value="abudhabi">Abu Dhabi</option>
              <option value="shanghai">Shanghai</option>
            </select>
          </div>

          <div class="form-control">
            <label class="label">Program <span id="programCount" class="small muted"></span></label>
            <select id="programSelect">
              <option disabled selected value="">Select Program</option>
            </select>
          </div>

          <div class="form-control">
            <label class="label">Transcript (PDF)</label>
            <input id="fileInput" type="file" accept="application/pdf" />
          </div>

          <div class="form-actions">
            <button class="btn" type="submit" id="uploadBtn">Upload</button>
            <button class="btn secondary" type="button" id="clearBtn">Clear</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Parsed Courses <small id="parsedCount">0</small></h2>
        <div id="parsedList" class="chips"></div>
      </div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="card">
        <h2>Progress</h2>
        <div id="progressTotals" class="small muted">—</div>
        <h3>Satisfied</h3>
        <ul id="satisfiedList"></ul>
        <h3>Pending</h3>
        <ul id="pendingList"></ul>
      </div>

      <div class="card">
        <h2>Plan</h2>
        <div id="planTotals" class="small muted">—</div>
        <ul id="planPicks"></ul>
        <div id="planNotes" class="small muted" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Validation <span id="validationOk" class="pill">—</span></h2>
      <div class="row">
        <div>
          <h3>Errors</h3>
          <ul id="errorsList"></ul>
        </div>
        <div>
          <h3>Warnings</h3>
          <ul id="warningsList"></ul>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Raw Response</h2>
      <pre id="rawJson" class="small muted">{}</pre>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
